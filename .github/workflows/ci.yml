name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token can only read the repository: CI verifies, it never writes.
permissions:
  contents: read

# A new push cancels the still-running pipeline of the previous push on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (immutable), with the
# version in a comment. A tag can be moved to malicious code; a SHA cannot.
jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token on disk for the following steps.
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9" # same uv as in development and in the Dockerfile
          enable-cache: true

      # --locked: fail if uv.lock is out of date instead of silently re-resolving.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

  docker:
    name: Docker build and smoke test
    needs: checks # only build images from code that passed lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false # no registry yet: build only
          load: true # make the image available to `docker run` below
          tags: site-monitor:ci
          # Reuse layers between pipeline runs (GitHub Actions cache).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not enough: prove the container actually starts and passes
      # its own HEALTHCHECK.
      - name: Smoke test (container becomes healthy)
        run: |
          docker run -d --name smoke site-monitor:ci
          for i in $(seq 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "Container did not become healthy"
          docker logs smoke
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f smoke || true
